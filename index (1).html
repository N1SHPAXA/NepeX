
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NepeX — Explore Beyond</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%239b8cff' d='M15 80 35 50 25 28 48 42 70 12 68 48 90 44 77 65 88 78 60 78 48 95 43 72Z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="side-top">
            <div class="brand">
    <svg class="dragon-mark" viewBox="0 0 128 128" role="img" aria-label="NepeX dragon emblem" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dragonMetal" x1="18" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4E9FF"/><stop offset=".42" stop-color="#B99AFF"/><stop offset=".76" stop-color="#72DFFF"/><stop offset="1" stop-color="#3979C9"/>
    </linearGradient>
    <linearGradient id="dragonShadow" x1="30" y1="30" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24204C"/><stop offset="1" stop-color="#080D24"/>
    </linearGradient>
    <filter id="dragonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M23 103 34 82 19 72 39 68 30 48 49 55 53 25 68 43 88 18 88 49 111 43 98 62 116 74 91 78 91 99 72 88 58 111 51 88Z" fill="url(#dragonMetal)" opacity=".22"/>
  <path d="M31 91 42 71 31 59 51 61 49 39 65 53 83 29 82 54 105 52 91 68 108 78 84 82 78 103 63 87 48 103 51 82Z" fill="url(#dragonMetal)" stroke="#D9CBFF" stroke-width="2.4" stroke-linejoin="round" filter="url(#dragonGlow)"/>
  <path d="M49 62 59 47 74 54 91 52 82 64 97 73 79 76 73 91 62 79 49 84 56 72Z" fill="url(#dragonShadow)" stroke="#9FEAFF" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M58 55 52 32 70 48 81 28 82 53" fill="none" stroke="url(#dragonMetal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M76 60 94 58 84 68 99 75 79 76" fill="none" stroke="#E9E0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M79 63 85 61" stroke="#7CF0FF" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M57 75 45 91 65 84 73 99" fill="none" stroke="#8FE8FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 105 43 96 54 108 68 95 82 105 102 94" fill="none" stroke="url(#dragonMetal)" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <circle cx="85" cy="62" r="2.1" fill="#FFFFFF"/>
</svg>
    <span>Nepe</span><span class="logo-x">X</span>
</div>
            <button class="icon-btn close-btn" onclick="toggleSidebar()">✕</button>
        </div>

        <button class="side-button active" onclick="newChat()">
            ＋ New chat
        </button>

        <button class="side-button" onclick="showFeature('Search chats')">
            ⌕ Search chats
        </button>

        <div class="menu-label">DISCOVER</div>

        <button class="side-button" onclick="showFeature('Images')">
            ▧ Images
        </button>

        <button class="side-button" onclick="showFeature('Explore AI')">
            ◈ Explore AI
        </button>

        <button class="side-button" onclick="showFeature('Library')">
            ▤ Library
        </button>

        <div class="menu-label">YOUR SPACE</div>

        <div class="recent-label">Recent chats</div>
        <div id="history">
            <div class="history-item">✦ Welcome to NepeX</div>
        </div>

        <div class="side-bottom">
            <button class="side-button" onclick="showFeature('Settings')">
                ⚙ Settings
            </button>

            <button class="profile" onclick="showFeature('My Account')">
                <div class="avatar">Y</div>
                <div>
                    <strong>My Account</strong>
                    <small>Free Plan</small>
                </div>
                <span class="profile-more">···</span>
            </button>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

        <header class="topbar">
            <div class="top-left">
                <button class="icon-btn" onclick="toggleSidebar()">☰</button>
                <span class="mobile-brand">NepeX</span>
                <button class="model-btn" onclick="showFeature('Model selection')">
                    Mini AI <span>⌄</span>
                </button>
            </div>

            <button class="share-btn" onclick="showFeature('Share')">
                ↗ Share
            </button>
        </header>

        <!-- CHAT AREA -->
        <section class="chat-area" id="chatArea">

            <div class="welcome" id="welcome">

                <div class="welcome-icon"><svg class="dragon-mark" viewBox="0 0 128 128" role="img" aria-label="NepeX dragon emblem" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dragonMetal" x1="18" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4E9FF"/><stop offset=".42" stop-color="#B99AFF"/><stop offset=".76" stop-color="#72DFFF"/><stop offset="1" stop-color="#3979C9"/>
    </linearGradient>
    <linearGradient id="dragonShadow" x1="30" y1="30" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24204C"/><stop offset="1" stop-color="#080D24"/>
    </linearGradient>
    <filter id="dragonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M23 103 34 82 19 72 39 68 30 48 49 55 53 25 68 43 88 18 88 49 111 43 98 62 116 74 91 78 91 99 72 88 58 111 51 88Z" fill="url(#dragonMetal)" opacity=".22"/>
  <path d="M31 91 42 71 31 59 51 61 49 39 65 53 83 29 82 54 105 52 91 68 108 78 84 82 78 103 63 87 48 103 51 82Z" fill="url(#dragonMetal)" stroke="#D9CBFF" stroke-width="2.4" stroke-linejoin="round" filter="url(#dragonGlow)"/>
  <path d="M49 62 59 47 74 54 91 52 82 64 97 73 79 76 73 91 62 79 49 84 56 72Z" fill="url(#dragonShadow)" stroke="#9FEAFF" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M58 55 52 32 70 48 81 28 82 53" fill="none" stroke="url(#dragonMetal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M76 60 94 58 84 68 99 75 79 76" fill="none" stroke="#E9E0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M79 63 85 61" stroke="#7CF0FF" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M57 75 45 91 65 84 73 99" fill="none" stroke="#8FE8FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 105 43 96 54 108 68 95 82 105 102 94" fill="none" stroke="url(#dragonMetal)" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <circle cx="85" cy="62" r="2.1" fill="#FFFFFF"/>
</svg></div>

                <h1>What can I help with?</h1>

                <p>Your personal AI assistant.</p>

                <div class="suggestions">

                    <button onclick="useSuggestion('What is HTML?')">
                        <span>⌨</span>
                        Learn programming
                    </button>

                    <button onclick="useSuggestion('Explain CSS')">
                        <span>✧</span>
                        Explore technology
                    </button>

                    <button onclick="showFeature('Image generation')">
                        <span>▧</span>
                        Create an image
                    </button>

                    <button onclick="showFeature('Document analysis')">
                        <span>▤</span>
                        Analyze documents
                    </button>

                </div>

            </div>

            <div id="chatbox" class="chatbox"></div>
            <div id="thinkingIndicator" class="thinking-indicator" role="status" aria-live="polite" hidden>
                <span class="thinking-orbit" aria-hidden="true"><span class="thinking-light"></span></span>
                <span>Just A Sec.</span>
            </div>

        </section>

        <!-- INPUT AREA -->
        <footer class="input-section">

            <div class="input-box">

                <textarea
                    id="userInput"
                    placeholder="Message NepeX..."
                    rows="1"
                ></textarea>

                <div class="input-actions">

                    <div class="left-actions">
                        <button class="input-btn"
                            onclick="showFeature('File attachments')">
                            ＋
                        </button>

                        <button class="tool-btn"
                            onclick="showFeature('Tools')">
                            ◈ Tools
                        </button>
                    </div>

                    <div class="right-actions">

                        <button class="input-btn"
                            onclick="showFeature('Voice mode')">
                            ♬
                        </button>

                        <button class="send-btn" onclick="sendMessage()">
                            ↑
                        </button>

                    </div>

                </div>

            </div>

            <p class="disclaimer">
                Mini AI can make mistakes. Check important information.
            </p>

        </footer>

    </main>

</div>

<!-- NOTIFICATION -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>

</body>
</html>
